<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Ye line website ko har screen par responsive banati hai -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - MDA Mustafa Digital Ai School</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- CSS Link -->
    <link rel="stylesheet" href="assets/css/login.css">
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            <!-- Left Side Branding -->
            <div class="login-branding">
                <img src="assets/images/logo.png" alt="MDA School Logo" class="logo">
                <h2>MDA Mustafa Digital Ai School</h2>
                <p>Admin Control Panel</p>
            </div>
            
            <!-- Right Side Form -->
            <div class="login-form-section">
                <h3>Welcome Back</h3>
                <p class="subtitle">Enter your admin password to continue</p>
                
                <form id="loginForm">
                    <div class="input-group">
                        <label for="adminPassword">Password *</label>
                        <!-- type="password" password ko hide rakhega (dots show honge) -->
                        <input type="password" id="adminPassword" placeholder="Enter Password" required>
                    </div>
                    
                    <!-- Error Message Div (Hidden by default) -->
                    <div id="errorMessage" class="error-message" style="display: none;">
                        Incorrect Password! Please try again.
                    </div>

                    <button type="submit" class="login-btn">Secure Login</button>
                </form>
            </div>
        </div>
    </div>

    <!-- JS Link -->
    <script src="assets/js/login.js"></script>
</body>
</html>
