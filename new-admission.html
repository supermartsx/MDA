<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Admission - MDA Mustafa Digital Ai School</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Global CSS (For Sidebar & Header) -->
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- Form CSS (For this specific page) -->
    <link rel="stylesheet" href="assets/css/forms.css">
</head>
<body>

    <!-- SIDEBAR (Same as Dashboard) -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <img src="assets/images/logo.png" alt="Logo" class="sidebar-logo">
            <div class="sidebar-title">
                <h4>MDA School</h4>
                <p>Management System</p>
            </div>
        </div>

        <ul class="sidebar-menu">
            <li class="menu-label">MAIN</li>
            <li><a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
            
            <li class="menu-label">STUDENTS</li>
            <li><a href="admission-enquiry.html"><i class="fas fa-question-circle"></i> Admission Enquiry</a></li>
            <li><a href="new-admission.html" class="active"><i class="fas fa-user-plus"></i> New Admission</a></li>
            <li><a href="all-students.html"><i class="fas fa-users"></i> All Students</a></li>
            
            <li class="menu-label">ACCOUNT</li>
            <li><a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
        </ul>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <!-- TOP HEADER -->
        <header class="top-header">
            <div class="header-left">
                <button id="menuToggle" class="menu-toggle"><i class="fas fa-bars"></i></button>
                <h2>New Admission</h2>
            </div>
        </header>

        <!-- FORM CONTENT -->
        <div class="dashboard-content">
            
            <!-- Breadcrumb and Top Buttons -->
            <div class="page-top-bar">
                <p class="breadcrumb">Register a new student for Session 2026-27</p>
                <a href="all-students.html" class="btn-back"><i class="fas fa-arrow-left"></i> Back to Students</a>
            </div>

            <form id="admissionForm" class="admission-form">
                
                <!-- Section 1: Basic Information -->
                <div class="form-section">
                    <h4 class="section-heading"><i class="fas fa-address-card"></i> Basic Information</h4>
                    <div class="form-grid">
                        <div class="input-group">
                            <label>Admission No *</label>
                            <input type="text" value="ADM-26-1052" readonly>
                        </div>
                        <div class="input-group">
                            <label>Full Name *</label>
                            <input type="text" placeholder="Student full name" required>
                        </div>
                        <div class="input-group">
                            <label>Father's Name *</label>
                            <input type="text" placeholder="Father's name" required>
                        </div>
                        <div class="input-group">
                            <label>Mother's Name *</label>
                            <input type="text" placeholder="Mother's name" required>
                        </div>
                        <div class="input-group">
                            <label>Date of Birth *</label>
                            <input type="date" required>
                        </div>
                        <div class="input-group">
                            <label>Gender *</label>
                            <select required>
                                <option value="">Select</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Section 2: Class & Admission -->
                <div class="form-section">
                    <h4 class="section-heading"><i class="fas fa-graduation-cap"></i> Class & Admission</h4>
                    <div class="form-grid">
                        <div class="input-group">
                            <label>Class *</label>
                            <select required>
                                <option value="">Select Class</option>
                                <option value="Nursery">Nursery</option>
                                <option value="LKG">LKG</option>
                                <option value="UKG">UKG</option>
                                <option value="1">Class 1</option>
                                <option value="10">Class 10</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>Section</label>
                            <select>
                                <option value="A">A</option>
                                <option value="B">B</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>Admission Date *</label>
                            <input type="date" required>
                        </div>
                        <div class="input-group">
                            <label>Religion</label>
                            <input type="text" placeholder="e.g. Islam">
                        </div>
                    </div>
                </div>

                <!-- Section 3: Contact Details -->
                <div class="form-section">
                    <h4 class="section-heading"><i class="fas fa-phone-alt"></i> Contact Details</h4>
                    <div class="form-grid">
                        <div class="input-group">
                            <label>Mobile No *</label>
                            <input type="text" placeholder="+92 XXXXX XXXXX" required>
                        </div>
                        <div class="input-group">
                            <label>WhatsApp No</label>
                            <input type="text" placeholder="Optional">
                        </div>
                        <div class="input-group full-width">
                            <label>Full Residential Address *</label>
                            <textarea rows="3" placeholder="Enter complete address" required></textarea>
                        </div>
                    </div>
                </div>

                <!-- Section 4: Document Uploads -->
                <div class="form-section">
                    <h4 class="section-heading"><i class="fas fa-file-upload"></i> Upload Documents</h4>
                    <div class="form-grid">
                        <div class="input-group">
                            <label>Student Photo</label>
                            <input type="file" accept="image/*">
                        </div>
                        <div class="input-group">
                            <label>B-Form / Birth Certificate</label>
                            <input type="file" accept="application/pdf, image/*">
                        </div>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="form-actions">
                    <button type="submit" class="btn-submit"><i class="fas fa-save"></i> Save Admission</button>
                    <button type="reset" class="btn-reset">Reset</button>
                </div>

            </form>
        </div>
    </main>

    <!-- Global JS (For Sidebar Toggle & Security) -->
    <script src="assets/js/main.js"></script>
    <script>
        // Form submit hone par kya karna hai
        document.getElementById('admissionForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert("Student Admission saved successfully! (Frontend Data only)");
            // Yahan future mein hum LocalStorage ya Firebase ka code add kar sakte hain data save karne ke liye.
            this.reset(); // Form clear karna
        });
    </script>
</body>
</html>
