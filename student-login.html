<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - MDA Mustafa Digital Ai School</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* Vibrant Multi-Color Gradient Background (Image 2 Exact) */
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #a855f7 0%, #3b82f6 45%, #06b6d4 100%);
            background-attachment: fixed;
        }

        /* White Modal Card */
        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            border-radius: 20px;
            padding: 35px 25px 40px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            text-align: center;
            position: relative;
        }

        /* School Logo */
        .school-logo-wrap {
            width: 85px;
            height: 85px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .school-logo-wrap img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .logo-fallback {
            width: 80px;
            height: 80px;
            background: #f1f5f9;
            border: 2px dashed #94a3b8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-size: 32px;
        }

        /* Error Notice (Pink Banner - Image 2 Exact) */
        .error-alert-box {
            display: none; /* Shown dynamically on wrong login */
            background: #fee2e2;
            border: 1px solid #fca5a5;
            color: #ef4444;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 22px;
            text-align: center;
            position: relative;
            animation: shake 0.3s ease;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }
        .close-alert-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #ef4444;
            font-size: 18px;
            cursor: pointer;
            line-height: 1;
        }

        /* Heading */
        .login-card h2 {
            font-size: 28px;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 30px;
            letter-spacing: -0.5px;
        }

        /* Inputs */
        .input-group-box {
            text-align: left;
            margin-bottom: 22px;
        }
        .input-group-box label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }
        .input-inner-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
            transition: 0.2s;
        }
        .input-inner-wrapper:focus-within {
            border-bottom-color: #a855f7;
        }
        .input-inner-wrapper i {
            color: #94a3b8;
            font-size: 16px;
            width: 20px;
            text-align: center;
        }
        .input-inner-wrapper input {
            width: 100%;
            border: none;
            outline: none;
            font-size: 14px;
            color: #1e293b;
            background: transparent;
        }
        .input-inner-wrapper input::placeholder {
            color: #94a3b8;
            font-size: 13.5px;
        }

        /* Gradient Submit Button */
        .btn-student-login {
            width: 100%;
            height: 50px;
            background: linear-gradient(90deg, #06b6d4 0%, #a855f7 50%, #ec4899 100%);
            border: none;
            border-radius: 30px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 8px 20px rgba(168, 85, 247, 0.35);
            transition: 0.3s;
        }
        .btn-student-login:hover {
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(168, 85, 247, 0.45);
        }
    </style>
</head>
<body>

    <div class="login-card">
        
        <!-- School Crest/Logo (Place your logo in assets/images/logo.png) -->
        <div class="school-logo-wrap">
            <img src="assets/images/logo.png" alt="School Crest" onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='flex';">
            <div id="logoFallback" class="logo-fallback" style="display:none;"><i class="fas fa-graduation-cap"></i></div>
        </div>

        <!-- Error Notification Banner (Image 2 Exact) -->
        <div class="error-alert-box" id="errorAlertBox">
            <span id="errorMessageText">You have no permission to login !</span>
            <button type="button" class="close-alert-btn" onclick="hideErrorAlert()">&times;</button>
        </div>

        <!-- Heading -->
        <h2>Student Login</h2>

        <!-- Login Form -->
        <form id="studentLoginForm">
            
            <!-- Admission No -->
            <div class="input-group-box">
                <label for="studentAdmNo">Admission No</label>
                <div class="input-inner-wrapper">
                    <i class="far fa-user"></i>
                    <input type="text" id="studentAdmNo" placeholder="Admission No" required autocomplete="off">
                </div>
            </div>

            <!-- Password -->
            <div class="input-group-box">
                <label for="studentPassword">Password</label>
                <div class="input-inner-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="studentPassword" placeholder="Type your password" required>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-student-login">LOGIN</button>
        </form>

    </div>

    <!-- Login Authentication Script -->
    <script>
        function hideErrorAlert() {
            document.getElementById('errorAlertBox').style.display = 'none';
        }

        document.getElementById('studentLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const admNo = document.getElementById('studentAdmNo').value.trim();
            const pass = document.getElementById('studentPassword').value.trim();
            const errorBox = document.getElementById('errorAlertBox');

            // Agar koi admission number na ho ya ghalat ho toh alert
            if (!admNo || !pass) {
                document.getElementById('errorMessageText').innerText = "Please enter Admission No & Password!";
                errorBox.style.display = 'block';
                return;
            }

            // Student session create karke redirect
            sessionStorage.setItem('mda_logged_student_adm', admNo);
            
            // Redirects to the separate student home dashboard
            window.location.href = 'student-home.html';
        });
    </script>
</body>
</html>
