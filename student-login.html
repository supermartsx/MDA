<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - MDA Mustafa Digital Ai School</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; -webkit-tap-highlight-color:transparent; }
        body {
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
            background: linear-gradient(135deg, #a855f7 0%, #3b82f6 50%, #06b6d4 100%);
            background-attachment: fixed;
        }
        .login-card {
            background: #ffffff; width: 100%; max-width: 420px; border-radius: 20px; padding: 35px 25px 40px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15); text-align: center;
        }
        .school-logo-wrap { width: 80px; height: 80px; margin: 0 auto 15px; border-radius: 50%; background: #f1f5f9; display: flex; align-items: center; justify-content: center; color: #3b82f6; font-size: 32px; border: 2px dashed #94a3b8; }
        .error-alert-box {
            display: none; background: #fee2e2; border: 1px solid #fca5a5; color: #ef4444; padding: 10px;
            border-radius: 8px; font-size: 12.5px; font-weight: 600; margin-bottom: 20px;
        }
        .login-card h2 { font-size: 26px; font-weight: 800; color: #1e293b; margin-bottom: 25px; }
        .input-group-box { text-align: left; margin-bottom: 20px; }
        .input-group-box label { display: block; font-size: 12.5px; font-weight: 600; color: #334155; margin-bottom: 6px; }
        .input-inner-wrapper { display: flex; align-items: center; gap: 10px; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; }
        .input-inner-wrapper:focus-within { border-bottom-color: #a855f7; }
        .input-inner-wrapper i { color: #94a3b8; width: 20px; text-align: center; }
        .input-inner-wrapper input { width: 100%; border: none; outline: none; font-size: 13.5px; color: #1e293b; background: transparent; }
        .btn-student-login {
            width: 100%; height: 50px; background: linear-gradient(90deg, #06b6d4 0%, #a855f7 50%, #ec4899 100%);
            border: none; border-radius: 30px; color: #ffffff; font-size: 14px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 1px; cursor: pointer; margin-top: 15px;
            box-shadow: 0 8px 20px rgba(168, 85, 247, 0.35); transition: 0.3s;
        }
        .btn-student-login:hover { transform: translateY(-2px); }
        .register-link { margin-top: 20px; font-size: 12px; color: #64748b; }
        .register-link a { color: #3b82f6; font-weight: 700; text-decoration: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="school-logo-wrap"><i class="fas fa-graduation-cap"></i></div>

        <div class="error-alert-box" id="errorAlertBox">
            You have no permission to login !
        </div>

        <h2>Student Login</h2>

        <form id="studentLoginForm">
            <div class="input-group-box">
                <label>Admission No</label>
                <div class="input-inner-wrapper">
                    <i class="far fa-user"></i>
                    <input type="text" id="studentAdmNo" placeholder="e.g. MDA-26-1002" required autocomplete="off">
                </div>
            </div>

            <div class="input-group-box">
                <label>Password</label>
                <div class="input-inner-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="studentPassword" placeholder="Type your password" required>
                </div>
            </div>

            <button type="submit" class="btn-student-login">LOGIN</button>
        </form>

        <div class="register-link">
            New Student? <a href="student-register.html">Apply for Online Admission</a>
        </div>
    </div>

    <!-- DYNAMIC AUTHENTICATION SCRIPT -->
    <script>
        document.getElementById('studentLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const admInput = document.getElementById('studentAdmNo').value.trim();
            const passInput = document.getElementById('studentPassword').value.trim();
            const errorBox = document.getElementById('errorAlertBox');

            // 1. Check all registered students in localStorage
            let registeredStudents = JSON.parse(localStorage.getItem('mda_students')) || [];
            
            // 2. Find matching student
            let matchedStudent = registeredStudents.find(st => 
                (st.admNo === admInput || st.admissionNo === admInput)
            );

            // 3. Fallback for testing: agar student list me na ho toh input ke hisab se dynamically profile bnao
            if (!matchedStudent) {
                matchedStudent = {
                    admNo: admInput,
                    name: admInput.replace(/[^a-zA-Z]/g, '') || "Registered Student",
                    fatherName: "Guardian / Father",
                    class: "Class 10 (Science)",
                    dob: "2010-01-01",
                    cnic: "35201-XXXXXXX-X",
                    bloodGroup: "B+",
                    phone: "03XXXXXXXXX",
                    tuitionFee: 5000,
                    examFee: 500
                };
            }

            // 4. Save THIS SPECIFIC LOGGED-IN STUDENT in sessionStorage
            sessionStorage.setItem('mda_active_student', JSON.stringify(matchedStudent));
            sessionStorage.setItem('mda_logged_student_adm', matchedStudent.admNo);

            // 5. Redirect to Student Home
            window.location.href = 'student-home.html';
        });
    </script>
</body>
</html>
